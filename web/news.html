<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News · Nova Workspace</title>
  <link rel="icon" href="/assets/app-icons/favicon-32.png?v=5" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/app-icons/icon-192.png?v=5">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="stylesheet" href="/assets/app.css?v=49">
  <style>
    .news-notes {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px; align-items: start;
    }
    .news-page-row {
      display: block; text-decoration: none; cursor: pointer;
      background: rgba(255, 253, 245, .88);
      border: 1px solid rgba(210, 200, 170, .45);
      border-radius: 4px 14px 4px 14px;
      padding: 14px 16px 12px;
      box-shadow: 0 4px 14px rgba(120, 100, 60, .10);
      transition: transform .22s var(--spring), box-shadow .22s var(--spring);
      position: relative;
    }
    .news-page-row::before {
      content: ""; position: absolute; top: -6px; left: 50%; transform: translateX(-50%) rotate(-1.5deg);
      width: 58px; height: 15px; border-radius: 2px;
      background: rgba(255, 214, 130, .75);
      box-shadow: 0 1px 3px rgba(120, 90, 20, .25);
    }
    .news-page-row:hover {
      transform: translateY(-3px) rotate(.3deg);
      box-shadow: 0 10px 24px rgba(120, 100, 60, .18);
    }
    .news-page-main { min-width: 0; }
    .news-page-title-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .news-page-title { font-size: 14.5px; font-weight: 600; color: var(--ink); line-height: 1.4; }
    .news-page-row:hover .news-page-title { color: var(--accent-ink); }
    /* 便签上省流默认 3 行，超出省略 */
    .news-page-tldr {
      margin-top: 8px; font-size: 13px; color: var(--ink-2); line-height: 1.7;
      overflow-wrap: anywhere;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .news-page-tldr.pending { color: var(--ink-3); }
    .news-src-sy { background: rgba(122, 162, 247, .18); color: #3b6fd4; }
    .news-page-meta { margin-top: 10px; padding-top: 8px; border-top: 1px dashed rgba(180, 165, 130, .4); font-size: 11.5px; color: var(--ink-3); }
    .news-open-btn {
      position: absolute; top: 10px; right: 10px;
      width: 26px; height: 26px; border-radius: 7px;
      display: grid; place-items: center;
      color: var(--ink-3); background: rgba(255,255,255,.6);
      border: 1px solid rgba(210, 200, 170, .5);
      text-decoration: none; font-size: 12px; line-height: 1;
      transition: color .15s ease, background .15s ease;
      z-index: 2;
    }
    .news-open-btn:hover { color: var(--accent); background: #fff; }
    @media (max-width: 820px) { .news-notes { grid-template-columns: 1fr; } }

    /* ---------- 详情大图弹层 ---------- */
    .news-detail-backdrop {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(28, 24, 40, .35);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; padding: 24px;
    }
    .news-detail-backdrop.show { display: flex; }
    .news-detail {
      width: min(680px, 100%); max-height: 82vh; overflow-y: auto;
      background: rgba(255, 253, 245, .97);
      border: 1px solid rgba(210, 200, 170, .5);
      border-radius: 6px 20px 6px 20px;
      box-shadow: 0 24px 60px rgba(60, 45, 20, .30);
      padding: 30px 30px 22px;
      position: relative;
    }
    .news-detail::before {
      content: ""; position: absolute; top: -7px; left: 50%; transform: translateX(-50%) rotate(-1.2deg);
      width: 92px; height: 20px; border-radius: 3px;
      background: rgba(255, 214, 130, .85);
      box-shadow: 0 1px 4px rgba(120, 90, 20, .28);
    }
    .news-detail-close {
      position: absolute; top: 12px; right: 12px;
      width: 30px; height: 30px; border-radius: 8px; border: none; cursor: pointer;
      background: rgba(0,0,0,.05); color: var(--ink-2); font-size: 14px;
    }
    .news-detail-close:hover { background: rgba(0,0,0,.10); }
    .news-detail-title { font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.45; margin: 10px 40px 6px 0; overflow-wrap: anywhere; }
    .news-detail-meta { font-size: 12px; color: var(--ink-3); margin-bottom: 14px; }
    .news-detail-tldr { font-size: 14.5px; color: var(--ink-2); line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; }
    .news-detail-actions { margin-top: 18px; padding-top: 14px; border-top: 1px dashed rgba(180,165,130,.45); display: flex; gap: 10px; }
    .news-detail-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: 999px; text-decoration: none;
      background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
    }
    .news-detail-link:hover { opacity: .9; }

    /* ---------- 来源分段控件（苹果风） ---------- */
    .src-seg {
      display: inline-flex; gap: 4px; margin: 14px 0 16px;
      background: rgba(0, 0, 0, .055);
      border: 1px solid rgba(0, 0, 0, .05);
      border-radius: 12px; padding: 4px;
    }
    .src-seg button {
      border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 16px; border-radius: 9px;
      font-size: 13px; font-weight: 500; font-family: inherit;
      color: var(--ink-2); background: transparent;
      transition: all .25s var(--spring);
    }
    .src-seg button:hover { color: var(--ink); }
    .src-seg button.on {
      background: #fff; color: var(--ink); font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .10), inset 0 1px 0 rgba(255,255,255,.8);
    }
    .src-seg .seg-dot { width: 8px; height: 8px; border-radius: 50%; }
    .seg-dot-ldo { background: #0a84ff; }
    .seg-dot-sy { background: #7aa2f7; }
    .seg-dot-arxiv { background: #b13b2c; }
    .seg-dot-idc { background: #7a5af8; }
    .seg-dot-ns { background: #e0a020; }
    .seg-dot-hn { background: #ff6600; }
    .seg-dot-sw { background: #0ea5a5; }
    .seg-dot-v2ex { background: #248a3d; }
    .src-seg .seg-count {
      font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px;
      background: rgba(0, 0, 0, .07); color: var(--ink-3);
    }
    .src-seg button.on .seg-count { background: var(--accent-soft); color: var(--accent-ink); }
    .src-seg button.on .seg-dot-ldo { box-shadow: 0 0 0 3px rgba(10,132,255,.18); }
    .src-seg button.on .seg-dot-sy { box-shadow: 0 0 0 3px rgba(122,162,247,.2); }
    .src-seg button.on .seg-dot-arxiv { box-shadow: 0 0 0 3px rgba(177,59,44,.16); }
    .src-seg button.on .seg-dot-v2ex { box-shadow: 0 0 0 3px rgba(36,138,61,.16); }
    .src-seg button.on .seg-dot-idc { box-shadow: 0 0 0 3px rgba(122,90,248,.18); }
    .src-seg button.on .seg-dot-ns { box-shadow: 0 0 0 3px rgba(224,160,32,.18); }
    .news-src-ns { background: rgba(224, 160, 32, .14); color: #b07810; }
    .news-src-hn { background: rgba(255, 102, 0, .12); color: #d35400; }
    .news-src-sw { background: rgba(14, 165, 165, .12); color: #0d8a8a; }
    .news-src-idc { background: rgba(122, 90, 248, .12); color: #6a4ae0; }
    .news-src-arxiv { background: rgba(177, 59, 44, .12); color: #a03325; }
    .news-star {
      position: absolute; top: 10px; right: 44px; z-index: 2;
      width: 30px; height: 30px; border: none; border-radius: 9px;
      background: transparent; color: var(--ink-3); cursor: pointer;
      font-size: 16px; line-height: 1; display: flex; align-items: center; justify-content: center;
      transition: transform .15s ease, color .15s ease;
    }
    .news-star:hover { transform: scale(1.15); color: #e6a700; }
    .news-star.on { color: #e6a700; }
    .news-saved-tag {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px;
      background: rgba(230, 167, 0, .14); color: #a07400;
    }
    .news-saved-list .news-page-row { transform: rotate(0deg); }
    .news-del {
      position: absolute; top: 10px; right: 78px; z-index: 2;
      width: 30px; height: 30px; border: none; border-radius: 9px;
      background: transparent; color: var(--ink-3); cursor: pointer;
      font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .2s ease, color .15s ease;
    }
    .news-page-row.del-visible .news-del { opacity: .9; pointer-events: auto; }
    .news-del:hover { color: #e0453e; background: rgba(224, 69, 62, .1); }
    .news-refresh-wrap { display: flex; align-items: center; gap: 10px; margin: 12px 0 4px; }
    .news-refresh-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 99px; border: 1px solid rgba(10, 132, 255, .35);
      background: rgba(10, 132, 255, .08); color: var(--accent-ink, #0a6fdb);
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .2s ease, transform .15s ease;
    }
    .news-refresh-btn:hover:not(:disabled) { transform: translateY(-1px); background: rgba(10, 132, 255, .14); }
    .news-refresh-btn:disabled { opacity: .38; cursor: not-allowed; border-color: rgba(120,120,128,.25); background: rgba(120,120,128,.07); color: var(--ink-3); }
    .news-refresh-hint { font-size: 11.5px; color: var(--ink-3); }
    .news-refresh-btn.refreshing svg { animation: news-spin 1s linear infinite; }
    @keyframes news-spin { to { transform: rotate(360deg); } }
    @media (max-width: 820px) { .src-seg { flex-wrap: wrap; } }
  </style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="topbar"><div class="crumbs"><span>Workspace</span><span>News</span></div><div class="topbar-spacer"></div></div>
    <div class="page narrow">
      <header class="page-head">
        <div class="page-emoji page-emoji-svg" data-icon="fire"></div>
        <div class="page-head-text">
          <h1 class="page-title">News</h1>
          <div class="page-meta"><span>L站 · 水源 · IDC · NS · V2EX · HN · SW · 点击便签看省流全文 · ↗ 跳原帖</span></div>
        </div>
      </header>

      <div class="news-refresh-wrap">
        <span class="task-count" id="newsMeta" style="margin:0"></span>
        <button class="news-refresh-btn" id="newsRefreshBtn" title="从库存里随机换一批">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          换一批
        </button>
        <span class="news-refresh-hint" id="newsRefreshHint"></span>
      </div>
      <div class="src-seg" id="srcSeg" role="tablist"></div>
      <div class="news-notes" id="newsList">
        <div class="mail-empty">正在加载…</div>
      </div>
    </div>
  </main>
</div>

<!-- 详情弹层 -->
<div class="news-detail-backdrop" id="newsDetail">
  <div class="news-detail" role="dialog" aria-modal="true">
    <button class="news-detail-close" id="newsDetailClose" title="关闭">✕</button>
    <div class="news-detail-title" id="ndTitle"></div>
    <div class="news-detail-meta" id="ndMeta"></div>
    <div class="news-detail-tldr" id="ndTldr"></div>
    <div class="news-detail-actions">
      <a class="news-detail-link" id="ndLink" href="#" target="_blank" rel="noopener noreferrer">打开原帖 ↗</a>
    </div>
  </div>
</div>

<script src="/assets/site-config.js"></script>
<script src="/assets/app.js?v=59"></script>
<script>
(function () {
  PortalLayout.mount({ active: "news", rail: false });

  var allItems = [];
  var savedItems = [];
  var savedKeys = {};
  var savedByKey = {};
  var currentSrc = "all";
  var SOURCES = [
    { id: "all", label: "全部", dot: null },
    { id: "saved", label: "收藏", dot: null },
    { id: "linux.do", label: "L站", dot: "seg-dot-ldo" },
    { id: "shuiyuan", label: "水源", dot: "seg-dot-sy" },
    { id: "idcflare", label: "IDC", dot: "seg-dot-idc" },
    { id: "nodeseek", label: "NS", dot: "seg-dot-ns" },
    { id: "hn", label: "HN", dot: "seg-dot-hn" },
    { id: "simonw", label: "SW", dot: "seg-dot-sw" },
    { id: "v2ex", label: "V2EX", dot: "seg-dot-v2ex" }
  ];

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function srcTag(src) {
    if (src === "linux.do") return '<span class="news-src news-src-ldo">L站</span>';
    if (src === "v2ex") return '<span class="news-src news-src-v2ex">V2EX</span>';
    if (src === "shuiyuan") return '<span class="news-src news-src-sy">水源</span>';
    if (src === "idcflare") return '<span class="news-src news-src-idc">IDC</span>';
    if (src === "nodeseek") return '<span class="news-src news-src-ns">NS</span>';
    if (src === "hn") return '<span class="news-src news-src-hn">HN</span>';
    if (src === "simonw") return '<span class="news-src news-src-sw">SW</span>';
    if (src === "arxiv") return '<span class="news-src news-src-arxiv">论文</span>'; // 存量旧帖仍有 arXiv
    return "";
  }
  function renderSeg() {
    var seg = document.getElementById("srcSeg");
    seg.innerHTML = "";
    SOURCES.forEach(function (sr) {
      var count = sr.id === "all" ? allItems.length
        : sr.id === "saved" ? savedItems.length
        : allItems.filter(function (i) { return i.source === sr.id; }).length;
      var btn = document.createElement("button");
      btn.setAttribute("role", "tab");
      if (sr.id === currentSrc) btn.className = "on";
      btn.innerHTML =
        (sr.dot ? '<span class="seg-dot ' + sr.dot + '"></span>' : "") +
        sr.label + '<span class="seg-count">' + count + "</span>";
      btn.addEventListener("click", function () {
        currentSrc = sr.id;
        renderSeg();
        render();
      });
      seg.appendChild(btn);
    });
  }

  /* 详情弹层 */
  var detail = document.getElementById("newsDetail");
  function openDetail(item) {
    document.getElementById("ndTitle").innerHTML = srcTag(item.source) + " " + esc(item.title);
    var meta = [];
    if (item.authors) meta.push(esc(item.authors));
    if (item.category) meta.push(esc(item.category));
    if (item.replies != null) meta.push(item.replies + " 回复");
    if (item.like_count != null) meta.push(item.like_count + " 赞");
    document.getElementById("ndMeta").textContent = meta.join(" · ");
    document.getElementById("ndTldr").textContent = item.tldr || "省流生成中…";
    document.getElementById("ndLink").href = item.url;
    detail.classList.add("show");
  }
  function closeDetail() { detail.classList.remove("show"); }
  document.getElementById("newsDetailClose").addEventListener("click", closeDetail);
  detail.addEventListener("click", function (e) { if (e.target === detail) closeDetail(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDetail(); });

  function render() {
    var box = document.getElementById("newsList");
    box.innerHTML = "";
    var items = currentSrc === "all"
      ? allItems
      : currentSrc === "saved"
      ? savedItems
      : allItems.filter(function (i) { return i.source === currentSrc; });
    box.className = currentSrc === "saved" ? "news-notes news-saved-list" : "news-notes";
    document.getElementById("newsMeta").textContent = items.length + " 条";
    if (!items.length) { box.innerHTML = '<div class="mail-empty">暂无内容</div>'; return; }
    items.forEach(function (it) {
      var row = document.createElement("div");
      row.className = "news-page-row";
      row.tabIndex = 0;
      var meta = [];
      if (it.category) meta.push(esc(it.category));
      if (it.replies != null) meta.push(it.replies + " 回复");
      if (currentSrc === "saved") meta.push('<span class="news-saved-tag">★ ' + esc(fmtTs(it.saved_at)) + '</span>');
      var tldr = it.tldr && it.source !== 'arxiv'  // arXiv 卡片只放双语标题，省流点开看
        ? '<div class="news-page-tldr">' + esc(it.tldr) + "</div>"
        : '';
      var starBtn = document.createElement('button');
      starBtn.className = 'news-star' + (savedKeys[keyOf(it)] ? ' on' : '');
      starBtn.title = savedKeys[keyOf(it)] ? '取消收藏' : '收藏（永久保存）';
      starBtn.textContent = savedKeys[keyOf(it)] ? '★' : '☆';
      starBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        toggleSave(it, starBtn);
      });
      row.innerHTML =
        '<a class="news-open-btn" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer" title="打开原帖">↗</a>' +
        '<div class="news-page-main">' +
          '<div class="news-page-title-line">' + srcTag(it.source) +
            '<span class="news-page-title">' + esc(it.title) + "</span></div>" +
          tldr +
          '<div class="news-page-meta">' + meta.join(" · ") + "</div>" +
        "</div>";
      row.appendChild(starBtn);
      var delBtn = document.createElement('button');
      delBtn.className = 'news-del';
      delBtn.title = '不看这条：从库存移除且以后不再出现';
      delBtn.textContent = '✕';
      // 长按便签 600ms 显示删除按钮（再点别处隐藏）
      var pressTimer = null;
      function showDel() { row.classList.add('del-visible'); }
      row.addEventListener('touchstart', function (e) {
        pressTimer = setTimeout(showDel, 600);
      }, { passive: true });
      row.addEventListener('touchend', function () { clearTimeout(pressTimer); });
      row.addEventListener('touchmove', function () { clearTimeout(pressTimer); });
      row.addEventListener('contextmenu', function (e) {
        // 桌面右键也显示（不弹菜单）
        e.preventDefault(); showDel();
      });
      document.addEventListener('click', function () { row.classList.remove('del-visible'); }, true);
      document.addEventListener('touchstart', function (e) {
        if (!e.target.closest('.news-del') && !e.target.closest('.news-page-row')?.contains(delBtn)) row.classList.remove('del-visible');
      }, true);
      delBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        fetch('/api/news-blocked', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: it.url, title: it.title })
        }).then(function (r) {
          if (r.status === 403) { portalToast && portalToast('仅管理员可删除帖子', 'error'); return null; }
          return r.json();
        }).then(function (d) {
          if (!d) return;
          load(false);
          portalToast && portalToast('已移除，以后不再出现', 'success');
        });
      });
      row.appendChild(delBtn);
      row.addEventListener("click", function (e) {
        if (e.target.closest(".news-open-btn")) return;  // 跳转按钮不触发弹层
        openDetail(it);
      });
      row.addEventListener("keydown", function (e) {
        if (e.key === "Enter") openDetail(it);
      });
      box.appendChild(row);
    });
  }

  function keyOf(it) {
    return String(it.url || "").split("#")[0].replace(/\/+$/, "");
  }
  function fmtTs(ts) {
    if (!ts) return "";
    var d = new Date(ts * 1000);
    function p(n) { return n < 10 ? "0" + n : n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function loadSaved() {
    return fetch("/api/news-saved", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (d) {
        savedItems = d.items || [];
        savedKeys = {}; savedByKey = {};
        savedItems.forEach(function (i) { savedKeys[i.key] = true; savedByKey[i.key] = i; });
        renderSeg();
        if (currentSrc === "saved") render();
      })
      .catch(function () {});
  }
  function toggleSave(it, btn) {
    var k = keyOf(it);
    if (savedKeys[k]) {
      fetch("/api/news-saved?url=" + encodeURIComponent(it.url), { method: "DELETE" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          savedItems = d.items || [];
          savedKeys = {}; savedByKey = {};
          savedItems.forEach(function (i) { savedKeys[i.key] = true; savedByKey[i.key] = i; });
          renderSeg();
          if (currentSrc === "saved") render();
          portalToast && portalToast("已取消收藏", "info");
        });
    } else {
      fetch("/api/news-saved", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(it)
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          savedItems = d.items || [];
          savedKeys = {}; savedByKey = {};
          savedItems.forEach(function (i) { savedKeys[i.key] = true; savedByKey[i.key] = i; });
          load(false);
          portalToast && portalToast("已收藏，移到收藏栏", "success");
        });
    }
  }

  /* ---------- 换一批：从库存随机抽（不点不换；删除/收藏后只补空位） ---------- */
  var refreshBtn = document.getElementById('newsRefreshBtn');
  var refreshHint = document.getElementById('newsRefreshHint');
  refreshBtn.addEventListener('click', function () {
    refreshBtn.disabled = true;
    refreshBtn.classList.add('refreshing');
    load(true);
  });

  function load(force) {
    fetch("/api/news" + (force ? "?refresh=1" : ""), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (d) {
        allItems = d.items || [];
        refreshHint.textContent = '库存 ' + (d.stock || 0) + ' 条';
        renderSeg(); render();
      })
      .catch(function () {
        document.getElementById("newsList").innerHTML = '<div class="mail-empty">加载失败，稍后重试</div>';
      })
      .then(function () {
        refreshBtn.disabled = false;
        refreshBtn.classList.remove('refreshing');
      });
  }

  load(false);
  loadSaved();
})();
</script>
</body>
</html>
