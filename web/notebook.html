<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notebook · Nova Workspace</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231f1f1f'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>N</text></svg>">
  <link rel="stylesheet" href="/assets/app.css?v=21">
  <style>
    .page.narrow { max-width:1280px; }
    .notebook { display:grid; grid-template-columns:260px minmax(0,1fr); min-height:650px; padding:0; overflow:hidden; border-radius:12px; box-shadow:0 18px 55px rgba(55,53,47,.08); }
    .note-sidebar { display:flex; min-width:0; flex-direction:column; border-right:1px solid var(--line); background:rgba(247,246,243,.72); }
    .note-sidebar-head { padding:14px 14px 11px; border-bottom:1px solid var(--line); }
    .note-sidebar-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; color:var(--ink-2); font-size:11px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; }
    .note-count { min-width:23px; padding:1px 7px; border-radius:999px; background:rgba(55,53,47,.08); color:var(--ink-2); text-align:center; font-size:10px; }
    .note-tools { display:flex; gap:7px; }
    .note-search-wrap { position:relative; min-width:0; flex:1; }
    .note-search-icon { position:absolute; left:9px; top:50%; color:var(--ink-3); transform:translateY(-50%); pointer-events:none; }
    .note-search { width:100%; min-width:0; border:1px solid var(--line); border-radius:7px; padding:8px 9px 8px 28px; outline:0; background:rgba(255,255,255,.78); color:var(--ink); transition:border-color .15s, box-shadow .15s; }
    .note-search:focus { border-color:rgba(46,170,220,.55); box-shadow:0 0 0 3px var(--accent-soft); }
    .note-new, .note-save, .note-delete, .mode-button, .format-button, .help-button { border:1px solid var(--line); border-radius:7px; cursor:pointer; background:rgba(255,255,255,.84); color:var(--ink); }
    .note-new { width:34px; padding:0; font-size:19px; line-height:32px; }
    .note-new:hover, .format-button:hover, .mode-button:hover, .help-button:hover { background:var(--bg-hover); border-color:var(--line-strong); }
    .note-list { display:flex; flex:1; min-height:0; flex-direction:column; gap:3px; padding:8px; overflow:auto; }
    .note-item { width:100%; border:1px solid transparent; border-radius:7px; padding:9px 10px; text-align:left; cursor:pointer; background:transparent; color:var(--ink); }
    .note-item:hover { background:rgba(255,255,255,.62); }
    .note-item.active { border-color:var(--line); background:rgba(255,255,255,.92); box-shadow:0 3px 12px rgba(55,53,47,.05); }
    .note-item strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; font-weight:600; }
    .note-item p { display:-webkit-box; overflow:hidden; margin:3px 0 5px; color:var(--ink-2); font-size:11px; line-height:1.4; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
    .note-item small { color:var(--ink-3); font-size:10px; }
    .note-empty { display:grid; min-height:160px; padding:24px; place-items:center; align-content:center; color:var(--ink-3); text-align:center; font-size:12px; }
    .note-empty span { display:block; margin-bottom:8px; font-size:26px; opacity:.65; }
    .note-editor { position:relative; display:flex; min-width:0; min-height:0; flex-direction:column; background:rgba(255,255,255,.82); }
    .note-editor-head { display:flex; min-height:66px; padding:12px 16px 10px 20px; align-items:center; gap:9px; border-bottom:1px solid var(--line); }
    .note-title-wrap { min-width:0; flex:1; }
    .note-title { width:100%; min-width:0; border:0; outline:0; background:transparent; color:var(--ink); font-family:inherit; font-size:22px; font-weight:650; line-height:1.25; letter-spacing:-.015em; }
    .note-title::placeholder { color:var(--ink-3); }
    .note-meta-line { display:flex; gap:7px; margin-top:3px; color:var(--ink-3); font-size:10px; }
    .note-meta-line span + span::before { content:"·"; margin-right:7px; }
    .note-save, .note-delete { padding:7px 12px; white-space:nowrap; }
    .note-save { border-color:var(--accent); background:var(--accent); color:white; font-weight:600; }
    .note-save:hover { filter:brightness(.96); }
    .note-delete { width:34px; padding:7px 0; color:var(--bad); font-size:16px; }
    button:disabled, input:disabled, textarea:disabled { cursor:not-allowed; opacity:.45; }
    .note-toolbar { display:flex; min-height:47px; padding:7px 10px 7px 14px; align-items:center; gap:5px; border-bottom:1px solid var(--line); background:rgba(247,246,243,.58); }
    .format-group { display:flex; align-items:center; gap:3px; }
    .format-group + .format-group { margin-left:3px; padding-left:8px; border-left:1px solid var(--line-strong); }
    .format-button, .help-button { display:grid; width:31px; height:31px; padding:0; place-items:center; font-size:13px; font-weight:600; }
    .format-button code { font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .format-button em { font-family:Georgia,serif; font-size:16px; }
    .toolbar-spacer { flex:1; }
    .mode-switch { display:flex; padding:2px; gap:2px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.72); }
    .mode-button { padding:5px 9px; border:0; background:transparent; color:var(--ink-2); font-size:11px; }
    .mode-button.active { background:white; color:var(--ink); box-shadow:0 1px 4px rgba(55,53,47,.12); }
    .help-button { margin-left:4px; border-radius:50%; color:var(--ink-2); }
    .note-workspace { display:grid; min-height:500px; flex:1; overflow:hidden; }
    .note-workspace[data-mode="split"] { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    .note-workspace[data-mode="edit"], .note-workspace[data-mode="preview"] { grid-template-columns:minmax(0,1fr); }
    .note-workspace[data-mode="edit"] .preview-pane, .note-workspace[data-mode="preview"] .write-pane { display:none; }
    .write-pane, .preview-pane { min-width:0; min-height:0; overflow:auto; }
    .write-pane { display:flex; background:rgba(255,255,255,.48); }
    .note-workspace[data-mode="split"] .write-pane { border-right:1px solid var(--line); }
    .note-body { width:100%; min-height:100%; padding:24px 26px 80px; resize:none; border:0; outline:0; background:transparent; color:var(--ink); font:14px/1.78 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; tab-size:2; }
    .note-body::placeholder { color:var(--ink-3); }
    .preview-pane { padding:24px 30px 80px; background:rgba(250,250,249,.58); }
    .markdown-preview { max-width:760px; margin:0 auto; overflow-wrap:anywhere; color:var(--ink); font-size:15px; line-height:1.75; }
    .markdown-preview > :first-child { margin-top:0; }
    .markdown-preview h1, .markdown-preview h2, .markdown-preview h3, .markdown-preview h4, .markdown-preview h5, .markdown-preview h6 { margin:1.35em 0 .55em; color:var(--ink); line-height:1.3; letter-spacing:-.015em; }
    .markdown-preview h1 { padding-bottom:.3em; border-bottom:1px solid var(--line); font-size:2em; }
    .markdown-preview h2 { padding-bottom:.25em; border-bottom:1px solid var(--line); font-size:1.5em; }
    .markdown-preview h3 { font-size:1.22em; }
    .markdown-preview p { margin:.75em 0; }
    .markdown-preview a { color:var(--accent-ink); text-decoration:underline; text-decoration-color:rgba(11,110,145,.28); text-underline-offset:3px; }
    .markdown-preview code { padding:.15em .38em; border-radius:4px; background:rgba(55,53,47,.07); color:#b13b2c; font:.9em ui-monospace,SFMono-Regular,Menlo,monospace; }
    .markdown-preview pre { position:relative; margin:1em 0; padding:16px 18px; overflow:auto; border:1px solid #2d2d2d; border-radius:8px; background:#242424; color:#ececec; line-height:1.65; }
    .markdown-preview pre code { padding:0; background:none; color:inherit; }
    .markdown-preview pre[data-lang]::before { content:attr(data-lang); position:absolute; top:7px; right:10px; color:#969696; font-size:9px; letter-spacing:.08em; text-transform:uppercase; }
    .markdown-preview blockquote { margin:1em 0; padding:4px 16px; border-left:3px solid var(--accent); color:var(--ink-2); background:var(--accent-soft); }
    .markdown-preview blockquote p { margin:.45em 0; }
    .markdown-preview ul, .markdown-preview ol { margin:.8em 0; padding-left:1.7em; }
    .markdown-preview li { margin:.28em 0; }
    .markdown-preview ul.task-list { padding-left:.2em; list-style:none; }
    .markdown-preview .task-item { display:flex; align-items:flex-start; gap:8px; }
    .markdown-preview .task-item input { margin-top:.48em; accent-color:var(--accent); }
    .markdown-preview hr { margin:2em 0; border:0; border-top:1px solid var(--line-strong); }
    .markdown-preview table { width:100%; margin:1em 0; border-collapse:collapse; font-size:13px; }
    .markdown-preview th, .markdown-preview td { padding:8px 10px; border:1px solid var(--line-strong); text-align:left; }
    .markdown-preview th { background:var(--bg-soft); font-weight:650; }
    .preview-empty { display:grid; min-height:300px; place-items:center; align-content:center; color:var(--ink-3); text-align:center; }
    .preview-empty span { margin-bottom:9px; font-size:30px; opacity:.55; }
    .note-footer { display:flex; min-height:34px; padding:7px 14px; align-items:center; gap:12px; border-top:1px solid var(--line); background:rgba(247,246,243,.6); color:var(--ink-3); font-size:11px; }
    .note-status { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .note-status[data-state="dirty"] { color:var(--warn); }
    .note-status[data-state="saved"] { color:var(--good); }
    .editor-stats { white-space:nowrap; font-variant-numeric:tabular-nums; }
    .markdown-help { position:absolute; z-index:20; right:20px; top:116px; width:min(360px,calc(100% - 40px)); padding:14px; border:1px solid var(--line-strong); border-radius:10px; background:rgba(255,255,255,.97); box-shadow:0 16px 45px rgba(55,53,47,.18); }
    .markdown-help[hidden] { display:none; }
    .markdown-help-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .markdown-help-head strong { font-size:13px; }
    .markdown-help-head button { border:0; background:none; color:var(--ink-2); cursor:pointer; font-size:17px; }
    .syntax-grid { display:grid; grid-template-columns:auto 1fr; gap:7px 12px; margin:0; font-size:11px; }
    .syntax-grid dt { color:var(--ink-2); }
    .syntax-grid dd { margin:0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    @media (max-width:900px) {
      .notebook { grid-template-columns:220px minmax(0,1fr); }
      .format-group:nth-of-type(3) { display:none; }
      .mode-button[data-mode="split"] { display:none; }
      .note-workspace[data-mode="split"] { grid-template-columns:1fr; }
      .note-workspace[data-mode="split"] .preview-pane { display:none; }
    }
    @media (max-width:700px) {
      .page { padding-left:12px; padding-right:12px; }
      .notebook { grid-template-columns:1fr; min-height:760px; }
      .note-sidebar { max-height:210px; border-right:0; border-bottom:1px solid var(--line); }
      .note-list { min-height:92px; }
      .note-item p { display:none; }
      .note-editor-head { min-height:60px; padding-left:14px; }
      .note-title { font-size:19px; }
      .note-delete { display:none; }
      .note-toolbar { overflow-x:auto; }
      .format-group { flex:0 0 auto; }
      .format-group:nth-of-type(2) { border-right:0; }
      .toolbar-spacer { min-width:3px; }
      .mode-switch { position:sticky; right:0; flex:0 0 auto; }
      .mode-button { padding:5px 8px; }
      .note-body, .preview-pane { padding:20px 18px 70px; }
      .note-footer { position:sticky; bottom:0; }
    }
    /* 视图切换、标签筛选、置顶分组 */
    .note-views { display:flex; gap:2px; padding:2px; border:1px solid var(--line); border-radius:7px; background:rgba(255,255,255,.6); letter-spacing:0; text-transform:none; }
    .note-view { padding:3px 9px; border:0; border-radius:5px; cursor:pointer; background:transparent; color:var(--ink-2); font-size:11px; font-weight:600; }
    .note-view.active { background:white; color:var(--ink); box-shadow:0 1px 3px rgba(55,53,47,.12); }
    .note-view small { margin-left:3px; color:var(--ink-3); font-weight:500; }
    .tag-filter { display:flex; flex-wrap:wrap; gap:4px; margin-top:9px; max-height:74px; overflow:auto; }
    .tag-filter:empty { display:none; }
    .tag-chip { display:inline-flex; align-items:center; gap:3px; max-width:100%; padding:2px 8px; border:1px solid transparent; border-radius:999px; background:rgba(46,170,220,.1); color:var(--accent-ink); font-size:11px; line-height:1.5; white-space:nowrap; }
    button.tag-chip { cursor:pointer; }
    button.tag-chip:hover { border-color:rgba(46,170,220,.4); }
    .tag-chip.active { background:var(--accent); color:white; }
    .tag-chip small { opacity:.7; }
    .note-group-label { padding:8px 10px 3px; color:var(--ink-3); font-size:10px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; }
    .note-item-tags { display:flex; flex-wrap:wrap; gap:3px; margin:0 0 5px; }
    .note-item-tags .tag-chip { padding:0 6px; font-size:10px; }
    .note-item small { display:flex; align-items:center; gap:6px; }
    .note-item .unsynced { width:6px; height:6px; border-radius:50%; background:var(--warn); }
    .note-item strong .pin-mark { margin-right:4px; font-size:11px; }
    /* 编辑区头部：标签编辑、置顶/归档按钮 */
    .note-editor-head { align-items:flex-start; }
    .note-head-actions { display:flex; gap:6px; padding-top:3px; }
    .note-icon-button { display:grid; width:34px; height:32px; padding:0; place-items:center; border:1px solid var(--line); border-radius:7px; cursor:pointer; background:rgba(255,255,255,.84); color:var(--ink-2); font-size:15px; }
    .note-icon-button:hover { background:var(--bg-hover); border-color:var(--line-strong); }
    .note-icon-button[aria-pressed="true"] { border-color:rgba(46,170,220,.5); background:var(--accent-soft); color:var(--accent-ink); }
    .note-delete { height:32px; }
    .note-tags { display:flex; flex-wrap:wrap; align-items:center; gap:4px; margin-top:7px; }
    .note-tags .tag-chip button { margin:0 -3px 0 1px; padding:0; border:0; cursor:pointer; background:none; color:inherit; font-size:12px; line-height:1; opacity:.6; }
    .note-tags .tag-chip button:hover { opacity:1; }
    .tag-input { width:110px; min-width:0; padding:2px 4px; border:0; border-bottom:1px dashed transparent; outline:0; background:transparent; color:var(--ink); font-size:11px; }
    .tag-input:focus { border-bottom-color:var(--line-strong); }
    .tag-input::placeholder { color:var(--ink-3); }
    .archived-badge { color:var(--warn); }
    .archived-badge[hidden] { display:none; }
    /* 附件：拖放提示、附件条、上传进度 */
    .note-workspace { position:relative; }
    .drop-overlay { position:absolute; z-index:15; inset:10px; display:none; place-items:center; border:2px dashed var(--accent); border-radius:10px; background:rgba(234,247,252,.88); color:var(--accent-ink); font-size:14px; font-weight:600; pointer-events:none; }
    .note-editor.dragging .drop-overlay { display:grid; }
    .note-attachments { display:flex; min-height:46px; padding:7px 14px; align-items:center; gap:7px; overflow-x:auto; border-top:1px solid var(--line); background:rgba(250,250,249,.7); }
    .note-attachments[hidden] { display:none; }
    .attach-label { flex:0 0 auto; color:var(--ink-3); font-size:11px; }
    .attach-item { display:flex; flex:0 0 auto; max-width:240px; align-items:center; gap:7px; padding:3px 5px 3px 3px; border:1px solid var(--line); border-radius:7px; background:white; font-size:11px; }
    .attach-thumb { display:grid; width:30px; height:30px; flex:0 0 auto; place-items:center; overflow:hidden; border-radius:5px; background:var(--bg-soft); font-size:14px; }
    .attach-thumb img { width:100%; height:100%; object-fit:cover; }
    .attach-name { min-width:0; overflow:hidden; color:var(--ink); text-decoration:none; text-overflow:ellipsis; white-space:nowrap; }
    .attach-name:hover { text-decoration:underline; }
    .attach-size { flex:0 0 auto; color:var(--ink-3); }
    .attach-item button { flex:0 0 auto; padding:2px 4px; border:0; border-radius:4px; cursor:pointer; background:none; color:var(--ink-2); font-size:11px; }
    .attach-item button:hover { background:var(--bg-hover); color:var(--ink); }
    .attach-item button.danger:hover { color:var(--bad); }
    .storage-usage { white-space:nowrap; font-variant-numeric:tabular-nums; }
    .storage-usage[data-level="warn"] { color:var(--warn); }
    .storage-usage[data-level="full"] { color:var(--bad); }
    .note-status[data-state="saving"] { color:var(--ink-2); }
    .note-status[data-state="error"] { color:var(--bad); }
    .markdown-preview img { display:block; max-width:100%; height:auto; margin:.6em 0; border:1px solid var(--line); border-radius:6px; }
    .markdown-preview a:has(> img) { display:inline-block; text-decoration:none; }
    @media (max-width:700px) {
      .note-tags { margin-top:5px; }
      .storage-usage { display:none; }
      .note-editor-head { flex-wrap:wrap; }
    }
  </style>
</head>
<body>
<div class="app">
  <main class="main">
    <div class="topbar"><div class="crumbs"><span>Nova Workspace</span><span>Private</span><span>Notebook</span></div><div class="topbar-spacer"></div></div>
    <div class="page narrow">
      <h1 class="page-title">Notebook</h1>
      <div class="page-meta"><span>Markdown 私人笔记 · 停止输入约 1 秒后自动保存 · 内容仅保存在你的服务器</span></div>
      <section class="card notebook">
        <aside class="note-sidebar">
          <div class="note-sidebar-head">
            <div class="note-sidebar-title"><div class="note-views" role="tablist" aria-label="笔记视图"><button class="note-view active" type="button" data-view="active" role="tab">笔记<small id="activeCount">0</small></button><button class="note-view" type="button" data-view="archived" role="tab">归档<small id="archivedCount">0</small></button></div><span id="noteCount" class="note-count" title="当前列表中的笔记数">0</span></div>
            <div class="note-tools"><label class="note-search-wrap"><span class="note-search-icon" aria-hidden="true">⌕</span><input id="noteSearch" class="note-search" type="search" placeholder="搜索标题、正文或标签…" aria-label="搜索笔记"></label><button id="noteNew" class="note-new" type="button" title="新建笔记" aria-label="新建笔记">＋</button></div>
            <div id="tagFilter" class="tag-filter" aria-label="按标签筛选"></div>
          </div>
          <div id="noteList" class="note-list"></div>
        </aside>
        <div id="noteEditor" class="note-editor">
          <div class="note-editor-head">
            <div class="note-title-wrap">
              <input id="noteTitle" class="note-title" maxlength="200" placeholder="笔记标题" aria-label="笔记标题">
              <div class="note-meta-line"><span id="noteUpdated">尚未选择笔记</span><span id="archivedBadge" class="archived-badge" hidden>已归档</span><span>Markdown</span></div>
              <div id="noteTags" class="note-tags"><input id="tagInput" class="tag-input" maxlength="30" placeholder="＋ 添加标签" aria-label="添加标签（回车确认）"></div>
            </div>
            <div class="note-head-actions">
              <button id="notePin" class="note-icon-button" type="button" aria-pressed="false" title="置顶">📌</button>
              <button id="noteArchive" class="note-icon-button" type="button" aria-pressed="false" title="归档">🗄</button>
              <button id="noteDelete" class="note-delete" type="button" title="删除笔记" aria-label="删除笔记">⌫</button>
            </div>
          </div>
          <div id="noteToolbar" class="note-toolbar" aria-label="Markdown 格式工具栏">
            <div class="format-group"><button class="format-button" type="button" data-format="heading" title="二级标题">H₂</button><button class="format-button" type="button" data-format="bold" title="粗体（Ctrl/⌘ + B）"><strong>B</strong></button><button class="format-button" type="button" data-format="italic" title="斜体（Ctrl/⌘ + I）"><em>I</em></button><button class="format-button" type="button" data-format="strike" title="删除线"><s>S</s></button><button class="format-button" type="button" data-format="code" title="行内代码"><code>&lt;/&gt;</code></button></div>
            <div class="format-group"><button class="format-button" type="button" data-format="link" title="链接">↗</button><button class="format-button" type="button" data-format="quote" title="引用">❝</button><button class="format-button" type="button" data-format="bullet" title="无序列表">•≡</button><button class="format-button" type="button" data-format="number" title="有序列表">1.</button><button class="format-button" type="button" data-format="task" title="任务清单">☑</button></div>
            <div class="format-group"><button class="format-button" type="button" data-format="codeblock" title="代码块"><code>{ }</code></button><button class="format-button" type="button" data-format="table" title="表格">▦</button><button class="format-button" type="button" data-format="rule" title="分隔线">―</button></div>
            <div class="format-group"><button class="format-button" type="button" data-format="attach" title="插入图片或附件（也可以直接粘贴截图或拖入文件）">📎</button><input id="fileInput" type="file" multiple hidden></div>
            <div class="toolbar-spacer"></div>
            <div class="mode-switch" role="group" aria-label="编辑模式"><button class="mode-button" type="button" data-mode="edit">编辑</button><button class="mode-button" type="button" data-mode="split">分栏</button><button class="mode-button" type="button" data-mode="preview">预览</button></div>

    // 本机草稿能兜底时不打扰；只有正在上传或浏览器存不了草稿时才提示
    if (uploadsActive || (draftStoreFailed && Object.keys(drafts).length)) { event.preventDefault(); event.returnValue = ""; }
  });
  window.addEventListener("online", function () { syncAll(); renderStatus(); });
  window.addEventListener("offline", renderStatus);

  function load() {
    request("/api/notes").then(function (data) {
      notes = data.notes || []; attachments = data.attachments || []; storage = data.storage || null;
      loadDrafts();
      var lastId = null; try { lastId = localStorage.getItem(ACTIVE_KEY); } catch (_) {}
      var last = find(lastId);
      if (last && last.archived) setView("archived");
      select(last || firstInView());
      Object.keys(drafts).forEach(function (id) { if (find(id) && id !== activeId) syncNote(id); });
      var orphans = Object.keys(drafts).filter(function (id) { return !find(id); });
      if (orphans.length) setTimeout(function () { rescueDrafts(orphans); }, 300);
    }).catch(function (error) { setStatus("载入失败：" + error.message + "（本机草稿仍保留，刷新重试）", "error"); });
  }
  var savedMode = "split"; try { savedMode = localStorage.getItem("notebook-view-mode") || "split"; } catch (_) {} setMode(savedMode); load();
})();
</script>
</body>
</html>
